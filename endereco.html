<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Endereço</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #141720;
      --card:      #1a1e2c;
      --border:    #272c3f;
      --accent:    #c9a84c;
      --accent2:   #e2c97a;
      --error:     #e05b5b;
      --success:   #56c894;
      --text:      #e8eaf2;
      --muted:     #7b82a0;
      --radius:    14px;
    }

    html { font-size: 16px; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Decorative blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .25;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 520px; height: 520px;
      background: radial-gradient(circle, #c9a84c 0%, transparent 70%);
      top: -140px; left: -180px;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #3d6fff 0%, transparent 70%);
      bottom: -100px; right: -120px;
      opacity: .18;
    }

    /* ── Layout ── */
    .container {
      width: 100%; max-width: 580px;
      position: relative; z-index: 1;
      animation: fadeUp .55s cubic-bezier(.25,.8,.25,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .header .badge {
      display: inline-block;
      font-size: .7rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(201,168,76,.35);
      padding: .3rem .85rem;
      border-radius: 50px;
      margin-bottom: 1.1rem;
      background: rgba(201,168,76,.07);
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.15;
      color: var(--text);
    }

    .header h1 span {
      color: var(--accent);
    }

    .header p {
      margin-top: .65rem;
      font-size: .9rem;
      color: var(--muted);
      font-weight: 300;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2.25rem;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
      transition: box-shadow .3s;
    }

    .card.success-flash {
      animation: successPulse .8s ease;
    }

    @keyframes successPulse {
      0%,100% { box-shadow: 0 24px 80px rgba(0,0,0,.45); }
      50%      { box-shadow: 0 0 0 3px var(--success), 0 24px 80px rgba(0,0,0,.45); }
    }

    /* ── Section divider ── */
    .section-label {
      font-size: .72rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Grid ── */
    .grid { display: grid; gap: 1.1rem; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 2fr 1fr 1fr; }

    @media (max-width: 480px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .card { padding: 1.75rem 1.25rem; }
    }

    /* ── Field wrap ── */
    .field-wrap {
      display: flex;
      flex-direction: column;
      gap: .35rem;
      position: relative;
    }

    label {
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .04em;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: .3rem;
    }

    label .req {
      color: var(--accent);
      font-size: .65rem;
    }

    label .opt {
      font-size: .65rem;
      color: var(--muted);
      opacity: .65;
      font-weight: 300;
    }

    input {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: .8rem 1rem;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      font-weight: 400;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
      width: 100%;
    }

    input::placeholder {
      color: rgba(123,130,160,.45);
      font-weight: 300;
    }

    input:focus {
      border-color: var(--accent);
      background: #1e2233;
      box-shadow: 0 0 0 3px rgba(201,168,76,.13);
    }

    /* Error state */
    .field-wrap.error input {
      border-color: var(--error);
      background: #1e1a1a;
    }
    .field-wrap.error input:focus {
      box-shadow: 0 0 0 3px rgba(224,91,91,.18);
    }
    .field-wrap.error label {
      color: var(--error);
    }

    .hint {
      font-size: .73rem;
      color: var(--muted);
      font-weight: 300;
      min-height: .9rem;
      padding-left: .1rem;
      transition: color .2s;
    }
    .field-wrap.error .hint {
      color: var(--error);
    }

    /* ── Divider ── */
    .divider { height: 1.5rem; }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%;
      margin-top: 1.8rem;
      padding: 1rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent) 0%, #b8872e 100%);
      color: #0d0f14;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      letter-spacing: .05em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 6px 24px rgba(201,168,76,.3);
    }

    .btn-submit::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform .45s ease;
    }

    .btn-submit:hover::after { transform: translateX(100%); }
    .btn-submit:hover { opacity: .92; box-shadow: 0 8px 32px rgba(201,168,76,.4); }
    .btn-submit:active { transform: scale(.985); }

    /* ── Footer note ── */
    .footer-note {
      text-align: center;
      font-size: .75rem;
      color: var(--muted);
      margin-top: 1.5rem;
      opacity: .6;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <div class="badge">Cadastro de Endereço</div>
      <h1>Informe seu <span>endereço</span></h1>
      <p>Preencha os campos abaixo. Campos marcados com <strong style="color:var(--accent)">*</strong> são obrigatórios.</p>
    </div>

    <div class="card" id="card">
      <form id="addressForm" novalidate>

        <!-- CEP + UF -->
        <p class="section-label">Localização</p>
        <div class="grid grid-2">

          <div class="field-wrap" data-hint="Formato: 00000-000">
            <label for="cep">CEP <span class="req">*</span></label>
            <input
              type="text"
              id="cep"
              name="cep"
              maxlength="9"
              placeholder="00000-000"
              inputmode="numeric"
              autocomplete="postal-code"
            />
            <span class="hint">Formato: 00000-000</span>
          </div>

          <div class="field-wrap" data-hint="2 letras maiúsculas (ex: SP)">
            <label for="uf">UF <span class="req">*</span></label>
            <input
              type="text"
              id="uf"
              name="uf"
              maxlength="2"
              placeholder="SP"
              autocomplete="address-level1"
            />
            <span class="hint">Ex: SP, RJ, MG</span>
          </div>

        </div>

        <div class="divider"></div>

        <!-- Logradouro + Número + Complemento -->
        <p class="section-label">Endereço</p>
        <div class="grid">

          <div class="field-wrap" data-hint="Mínimo de 5 caracteres">
            <label for="logradouro">Logradouro <span class="req">*</span></label>
            <input
              type="text"
              id="logradouro"
              name="logradouro"
              placeholder="Rua, Avenida, Praça..."
              autocomplete="address-line1"
            />
            <span class="hint">Mínimo de 5 caracteres</span>
          </div>

          <div class="grid grid-2">

            <div class="field-wrap" data-hint="Somente números">
              <label for="numero">Número <span class="req">*</span></label>
              <input
                type="text"
                id="numero"
                name="numero"
                placeholder="123"
                inputmode="numeric"
                autocomplete="address-line2"
              />
              <span class="hint">Somente números</span>
            </div>

            <div class="field-wrap" data-hint="">
              <label for="complemento">Complemento <span class="opt">(opcional)</span></label>
              <input
                type="text"
                id="complemento"
                name="complemento"
                placeholder="Apto, Bloco..."
                autocomplete="address-line3"
              />
              <span class="hint"></span>
            </div>

          </div>

        </div>

        <button type="submit" class="btn-submit">Cadastrar Endereço</button>

      </form>
    </div>

    <p class="footer-note">js-scrum-2026 · Issue #3 · feat: cadastro de endereço</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
